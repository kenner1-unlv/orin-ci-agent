[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-plane-reviewer"
version = "0.1.0"
description = "Read-only code review gate for bounded worker jobs"
requires-python = ">=3.10"

[project.scripts]
review-worker-job = "control_plane_reviewer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
